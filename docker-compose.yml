services:
  postgres:
    image: imresamu/postgis:16-3.5-alpine
    container_name: infradon-postgres
    environment:
      POSTGRES_USER: infradon
      POSTGRES_PASSWORD: infradon
      POSTGRES_DB: infradon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  pgdata:
